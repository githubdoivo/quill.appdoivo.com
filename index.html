<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Quill · A Quiet Place for Your Mind</title>
<meta name="description" content="A private journal: diary with moods, Notion-like pages with tables, free boards and moodboards, photo albums and burn books. Everything stays on your device.">
<meta property="og:title" content="Quill · A Quiet Place for Your Mind">
<meta property="og:description" content="Diary, moods, pages, boards, albums and burn books. Private: everything stays on your device.">
<meta property="og:url" content="https://quill.appdoivo.com/">
<meta property="og:type" content="website">
<link rel="canonical" href="https://quill.appdoivo.com/">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quill">
<meta name="theme-color" content="#f3eee6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/app.css?v=3">
<link rel="stylesheet" href="/look.css?v=3">
<script type="module" src="/js/app.js?v=3"></script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="page">
<a class="skip" href="#main" data-w="skip">Skip to Content</a>
<div class="shell">
  <header class="top">
    <a class="brand" href="#today"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 4h15a3 3 0 0 1 3 3v21H11a3 3 0 0 1-3-3Z"/><path d="M8 25a3 3 0 0 1 3-3h15M13 10h8M13 14h6"/></svg><span data-w="brand">Quill</span></a>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-view="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span data-w="navToday">Today</span></button>
      <button type="button" data-view="pages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6Z"/><path d="M15 3v4h4M9 12h7M9 16h5"/></svg><span data-w="navPages">Pages</span></button>
      <button type="button" data-view="boards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="10" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="16" width="8" height="4" rx="1.5"/></svg><span data-w="navBoards">Boards</span></button>
      <button type="button" data-view="books"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5C5.5 4 9 4 12 6c3-2 6.5-2 9-.5V19c-2.5-1.5-6-1.5-9 .5-3-2-6.5-2-9-.5Z"/><path d="M12 6v13.5"/></svg><span data-w="navBooks">Books</span></button>
      <button type="button" data-view="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span data-w="navSearch">Search</span></button>
      <button type="button" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-w="navSettings">Settings</span></button>
    </nav>
    <div class="tools">
      <button type="button" class="icon-btn" id="theme" data-w-label="themeToggle" aria-label="Switch Theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/><g class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg></button>
      <button type="button" class="lang-btn" id="lang" data-w-label="langLabel" aria-label="PT · Ver em português" data-w="langSwitch">PT</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>
</div>

<dialog id="confirm" aria-labelledby="confirm-text">
  <form method="dialog">
    <p id="confirm-text"></p>
    <label class="f" data-type hidden><span id="confirm-type-label"></span><input name="typed" autocomplete="off"></label>
    <div class="dialog-actions"><span class="spacer"></span><button value="no" class="ghost" data-w="cancel">Cancel</button><button value="yes" class="primary" id="confirm-yes">OK</button></div>
  </form>
</dialog>
<input type="file" id="file-pick" hidden multiple>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span></span><button type="button" class="ghost small" hidden></button></div>
<script src="/js/frame.js"></script>
<noscript><p class="noscript">This app needs JavaScript. Your journal never leaves this device.</p></noscript>
</body>
</html>
